apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  PORT: "5000"
  NODE_ENV: "production"

---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  MONGO_URI: "mongodb://mongo-ss-0.mongo-service:27017,mongo-ss-1.mongo-service:27017,mongo-ss-2.mongo-service:27017/merndb?replicaSet=rs0&readPreference=secondaryPreferred"
