apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-backup-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-backup-job
  labels:
    app: mongo-backup
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 60
  template:
    spec:
      serviceAccountName: backup-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: OnFailure
      containers:
        - name: mongo-backup
          image: mongo:8.3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: backend-secret
          command:
            - /bin/sh
            - -c
            - |
              TIMESTAMP=$(date +%Y%m%d-%H%M%S)
              BACKUP_FILE="/backup/merndb-${TIMESTAMP}.archive.gz"
              echo "Starting backup of ${MONGO_URI} to ${BACKUP_FILE}..."
              mongodump --uri="${MONGO_URI}" --archive="${BACKUP_FILE}" --gzip
              echo "Backup completed successfully!"
              ls -lh /backup
          volumeMounts:
            - name: backup-storage
              mountPath: /backup
      volumes:
        - name: backup-storage
          persistentVolumeClaim:
            claimName: mongo-backup-pvc
