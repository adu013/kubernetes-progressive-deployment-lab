apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-backup-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongo-backup-cronjob
spec:
  # Run every 2 minutes for testing (use "0 2 * * *" for daily run at 2AM)
  schedule: "*/2 * * * *"
  # Prevents overlapping backups if a previous run is still active
  concurrencyPolicy: Forbid
  # Keeps the last 3 completed Job objects in Kubernetes
  successfulJobsHistoryLimit: 3
  # Keeps the last 1 completed Job objects for debugging
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 60
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: mongo-backup
              image: mongo:8.3
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: backend-secret
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  BACKUP_FILE="/backup/merndb-${TIMESTAMP}.archive.gz"

                  echo ""
                  echo "Starting scheduled backup of ${MONGO_URI} to ${BACKUP_FILE}..."
                  mongodump --uri="${MONGO_URI}" --archive="${BACKUP_FILE}" --gzip

                  echo "Pruning old backups (keeping latest 5)..."
                  ls -1t /backup/merndb-*.archive.gz | tail -n +6 | xargs -r rm -f

                  echo "Current backups in /backup!"
                  ls -lh /backup
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: mongo-backup-pvc
